[project]
name = "local-ai-data-analyst"
version = "0.1.0"
description = "An AI-powered SQL generation agent that converts natural-language business questions into SQL queries using LLMs and PostgreSQL."
readme = "README.md"
authors = [
    { name = "amMahendran"}
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "deepagents>=0.7.32",
    "langchain>=1.4.8",
    "langchain-google-genai>=4.4.2",
    "langchain-ollama>=1.1.0",
    "ollama>=0.6.3",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
    "sqlglot>=30.27.0",
]

[project.scripts]
local-ai-data-analyst = "local_ai_data_analyst.main:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
